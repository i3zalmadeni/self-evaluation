<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل الدخول – التقويم الذاتي الذكي</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/core.css"></head><body class="pubsite lgbody">
<div class="login card lgc"><div class="lgi" data-core></div><h2>تسجيل الدخول</h2><p class="sub">التقويم الذاتي الذكي · متوسطة لبيد بن ربيعة<br>بحساب النواة الرقمية نفسه</p>
<form id="f"><label for="e">البريد الإلكتروني</label><input id="e" type="email" required autocomplete="username">
<label for="p">كلمة المرور</label><input id="p" type="password" required autocomplete="current-password">
<p class="err" id="m" role="alert"></p><button class="btn">دخول</button></form></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/config.js"></script><script>
const sb = supabase.createClient(APP_CONFIG.supabaseUrl, APP_CONFIG.supabaseKey);
if (location.search.includes("nostaff")) document.getElementById("m").textContent = "هذا الحساب غير مرتبط بسجل منسوب في النواة.";
sb.auth.getSession().then(({ data }) => { if (data.session) location.replace("dashboard.html"); });
document.getElementById("f").onsubmit = async (ev) => { ev.preventDefault();
  const { error } = await sb.auth.signInWithPassword({ email: document.getElementById("e").value.trim(), password: document.getElementById("p").value });
  if (error) document.getElementById("m").textContent = "بيانات الدخول غير صحيحة."; else location.replace("dashboard.html"); };
</script></body></html>
